apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: starterapp
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0 # never drop below one Ready pod during a deploy
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
        app.kubernetes.io/part-of: starterapp
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: backend
          image: starterapp-backend # replaced by overlays/production/kustomization.yaml's images: field
          ports:
            - name: http
              containerPort: 8080
          lifecycle:
            preStop:
              # kube-proxy removes a terminating pod's endpoint asynchronously
              # with SIGTERM delivery; this sleep gives the removal time to
              # propagate so no request is routed to a pod that has already
              # stopped accepting.
              exec:
                command: ["sleep", "5"]
          envFrom:
            - secretRef:
                name: starterapp-app-secrets
            - configMapRef:
                name: starterapp-backend-config
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: starterapp
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: backend
  ports:
    - port: 8080
      targetPort: 8080
